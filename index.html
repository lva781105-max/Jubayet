<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mymensingh District</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 30px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        h2 {
            color: #1e3a8a;
        }

        li {
            margin: 10px 0;
        }

        footer {
            text-align: center;
            background: #222;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ময়মনসিংহ জেলা</h1>
        <p>আমার প্রথম HTML ওয়েবসাইট</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>ময়মনসিংহের কিছু উপজেলা</h2>

            <ul>
                <li>গফরগাঁও</li>
                <li>ভালুকা</li>
                <li>ত্রিশাল</li>
                <li>ফুলবাড়ীয়া</li>
                <li>ঈশ্বরগঞ্জ</li>
            </ul>
        </div>

        <div class="card">
            <h2>আমার সম্পর্কে</h2>

            <p>
                আমি HTML শিখছি এবং ধীরে ধীরে
                ওয়েবসাইট তৈরি করতে চাই।
            </p>

            <button onclick="alert('HTML শেখা শুরু হয়ে গেছে! 🚀')">
                এখানে চাপ দাও
            </button>
        </div>

    </div>

    <footer>
        <p>© 2026 My First Website</p>
    </footer>

</body>
</html>
